[package]
name = "server-412-23"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
anyhow = "1"
argon2 = "0.5"
async-graphql = "7"
async-graphql-actix-web = "7"
chrono = "0.4.41"
dotenvy = "0.15"
hmac = "0.12"
jwt = "0.16"
rust_decimal = "1.37.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-rustls-ring-webpki",
    "postgres",
    "chrono",
    "rust_decimal",
] }
